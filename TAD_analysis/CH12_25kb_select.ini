[x-axis]
where = top

[spacer]

# =======================
# Hi-C (balanced mcool)
# =======================
[hic_matrix]
file = CH12_25kbp.mcool::/resolutions/25000
file_type = hic_matrix
title = CH12 chr7 (25 kb)
depth = 400000
transform = log1p
colormap = YlOrRd
same_yaxis = yes
# zMin = 0
# zMax = 3

[tads]
file = TADs_CH12_chr7_25kb_domains.bed
file_type = domains
title = TAD domains
border_color = black
color = none
overlay_previous = share-y
border_width = 2

[spacer]

# =======================
# Genes
# =======================
[genes]
file = /projects/academic/omergokc/Luane/Mouse_SG/HiC/GCF_000001635.26_GRCm38.p6_genomic_chrNames.gtf
file_type = gtf
title = Genes (GRCm38)
height = 4
style = UCSC
merge_transcripts = true
labels = true
label_field = gene_name
fontsize = 8
label_fontsize = 8

[spacer]

# ==========================================
# ATAC-seq (Heart cells; ENCSR451NAE)
# ==========================================
[ATAC_heart]
# https://www.encodeproject.org/experiments/ENCSR451NAE/
file = ENCFF384BWM.bigWig
file_type = bigwig
title = ATAC-seq (Heart cells)
height = 2.5
color = #4f8c85  # greenish tone from your palette
min_value = 0
max_value = auto
nans_to_zeros = true
show_data_range = yes
alpha = 0.9

[spacer]

[H3K4me3_012DBS]
# https://www.encodeproject.org/experiments/ENCSR000CGK/
file = ENCFF012DBS.bigWig
file_type = bigwig
title = H3K4me3 (ENCFF012DBS)
height = 2
min_value = 0
max_value = auto
nans_to_zeros = true

[spacer]

# ==========================================
# Architectural proteins / cohesin axis
# ==========================================
[CTCF]
# https://www.encodeproject.org/experiments/ENCSR000ERM/
file = ENCFF255NVD.bigWig
file_type = bigwig
title = CTCF
height = 2
min_value = 0
max_value = auto
nans_to_zeros = true

[RAD21]
# https://www.encodeproject.org/experiments/ENCSR000ERK/
file = ENCFF021SZL.bigWig
file_type = bigwig
title = RAD21
height = 2
min_value = 0
max_value = auto
nans_to_zeros = true
